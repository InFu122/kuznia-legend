# Gra + przekierowanie API Nakamy pod jednym adresem (bez CORS i bez drugiego portu dla gracza).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker DNS — nginx znajdzie kontener Nakamy także po jego restarcie
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $nakama http://nakama:7350;

  location /v2/ {
    proxy_pass $nakama;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  location = /ws {
    proxy_pass $nakama;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # Muzyka i dźwięki (public/audio) — nazwy bez skrótu, więc krótszy cache niż /assets/
  location /audio/ {
    expires 7d;
    add_header Cache-Control "public";
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
