# Gra + przekierowanie API Nakamy pod jednym adresem (bez CORS i bez drugiego portu dla gracza).
# Ten plik trafia do bloku http nginx (conf.d), więc strefy limitów można zadeklarować tutaj.

# Limit zapytań do API z jednego adresu — chroni serwer, gdy gra jest dostępna z internetu (Tailscale Funnel).
# Gra wysyła kilka zapytań na minutę, więc normalny gracz nigdy go nie dotknie.
limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
limit_req_status 429;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Prawdziwy adres gracza z nagłówka pośrednika (Tailscale, Docker) — do limitu zapytań.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 100.64.0.0/10;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Docker DNS — nginx znajdzie kontener Nakamy także po jego restarcie
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $nakama http://nakama:7350;

  location /v2/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass $nakama;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  location = /ws {
    limit_req zone=api burst=20 nodelay;
    proxy_pass $nakama;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff;
  }

  # Muzyka i dźwięki (public/audio) — nazwy bez skrótu, więc krótszy cache niż /assets/
  location /audio/ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff;
  }

  location /icons/ {
    expires 7d;
    add_header Cache-Control "public";
  }

  # Service worker i plik wersji zawsze świeże — po aktualizacji gra od razu wie o nowej wersji.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }
  location = /version.json {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;
    add_header X-Frame-Options SAMEORIGIN;
  }
}
