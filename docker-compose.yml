# Kuźnia Legend — serwer gry na Dockerze (np. CasaOS).
#   1. cp .env.example .env  i ustaw własne hasła i klucze
#   2. docker compose up -d --build
#   3. gra: http://ADRES-SERWERA:8080 · konsola Nakamy: http://ADRES-SERWERA:7351
name: kuznia-legend

# Dzienniki kontenerów (adresy IP graczy) mają ograniczony rozmiar — najstarsze wpisy znikają same
# (tak mówi polityka prywatności).
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 20

  nakama:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: kuznia-legend/nakama:local
    restart: unless-stopped
    logging: *logs
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >
        /nakama/nakama migrate up --database.address "nakama:${POSTGRES_PASSWORD}@postgres:5432/nakama" &&
        exec /nakama/nakama --config /nakama/data/kuznia.yml
        --database.address "nakama:${POSTGRES_PASSWORD}@postgres:5432/nakama"
        --socket.server_key "${NAKAMA_SERVER_KEY:?Ustaw NAKAMA_SERVER_KEY w pliku .env}"
        --session.encryption_key "${NAKAMA_SESSION_KEY:?Ustaw NAKAMA_SESSION_KEY}"
        --session.refresh_encryption_key "${NAKAMA_REFRESH_KEY:?Ustaw NAKAMA_REFRESH_KEY}"
        --runtime.http_key "${NAKAMA_HTTP_KEY:?Ustaw NAKAMA_HTTP_KEY}"
        --console.username "${NAKAMA_CONSOLE_USER:-admin}"
        --console.password "${NAKAMA_CONSOLE_PASSWORD:?Ustaw NAKAMA_CONSOLE_PASSWORD}"
        --console.signing_key "${NAKAMA_CONSOLE_KEY:?Ustaw NAKAMA_CONSOLE_KEY}"
        --runtime.env "TEST_SPEED=${TEST_SPEED:-100}"
    volumes:
      # Klucz konta usługi Google do sprawdzania zakupów w Google Play: plik sekrety/google-play.json obok tego
      # pliku (docs/GOOGLE_PLAY.md). Katalogu nie ma w repozytorium; bez pliku płatności czekają.
      - ./sekrety:/nakama/data/modules/sekrety:ro
    ports:
      - "${NAKAMA_PORT:-7350}:7350"           # API (aplikacja na telefon połączy się tu bezpośrednio)
      - "${NAKAMA_CONSOLE_PORT:-7351}:7351"   # konsola administratora
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_SERVER_KEY: ${NAKAMA_SERVER_KEY}
        OWNER_NAME: ${OWNER_NAME:-}
        CONTACT_EMAIL: ${CONTACT_EMAIL:-}
        ADMOB_PUBLISHER_ID: ${ADMOB_PUBLISHER_ID:-}
    image: kuznia-legend/web:local
    restart: unless-stopped
    logging: *logs
    depends_on:
      - nakama
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
