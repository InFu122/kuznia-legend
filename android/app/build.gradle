apply plugin: 'com.android.application'

android {
    namespace = "pl.kuznialegend.gra"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.kuznialegend.gra"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Numer kolejnej kompilacji (GitHub Actions) — telefon instaluje nową wersję na starej.
        // Wydanie do Google Play (workflow play.yml) podaje własny numer i nazwę wersji (KL_VERSION_CODE, KL_VERSION_NAME).
        versionCode((System.getenv("KL_VERSION_CODE") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName(System.getenv("KL_VERSION_NAME") ?: ("0.1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")))
        // Identyfikator aplikacji AdMob (bez niego aplikacja z reklamami nie wystartuje). Domyślnie przykładowy
        // identyfikator Google do testów — wydanie do Google Play dostaje prawdziwy ze zmiennej ADMOB_APP_ID.
        manifestPlaceholders = [admobAppId: System.getenv("ADMOB_APP_ID") ?: "ca-app-pub-3940256099942544~3347511713"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Klucz testowy (w repozytorium) — tylko do wersji testowych dla znajomych.
    // Do Google Play: tajny klucz przesyłania (upload key) z sekretów GitHuba — workflow play.yml zapisuje go
    // do pliku i podaje ścieżkę i hasła w zmiennych KL_UPLOAD_*. Klucza przesyłania nie ma w repozytorium.
    def uploadStore = System.getenv("KL_UPLOAD_STORE_FILE")
    signingConfigs {
        test {
            storeFile file('kuznia-test.keystore')
            storePassword 'kuznia-test'
            keyAlias 'kuznia'
            keyPassword 'kuznia-test'
        }
        if (uploadStore) {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv("KL_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("KL_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("KL_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig uploadStore ? signingConfigs.upload : signingConfigs.test
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
