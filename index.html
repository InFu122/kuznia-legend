    <style>
      /* Ekran ładowania — widać go, zanim wczyta się gra (pasek postępu ustawia src/ui/boot.ts). */
      #boot{position:fixed; inset:0; z-index:100; display:grid; place-items:center; background:#16120f; color:#f3e7cf; overflow:hidden;
        font-family:'Barlow', system-ui, sans-serif; transition:opacity .45s ease}
      #boot.done{opacity:0; pointer-events:none}
      #boot .b-scene{position:absolute; inset:-2%; background-repeat:no-repeat; background-size:auto 54%; background-position:68% 100%; image-rendering:pixelated; filter:saturate(1.15);
        -webkit-mask-image:linear-gradient(transparent 44%, #000 58%); mask-image:linear-gradient(transparent 44%, #000 58%);
        animation:b-zoom 14s ease-out both}
      #boot::before{content:""; position:absolute; inset:0; z-index:1;
        background:radial-gradient(ellipse at 70% 85%, rgba(255,140,50,.22), transparent 50%), linear-gradient(rgba(22,18,15,.1), rgba(22,18,15,.35) 60%, rgba(22,18,15,.75))}
      #boot .b-in{position:relative; z-index:2; width:min(320px, 82vw); display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:-8vh}
      #boot .b-title{font-family:'Grenze Gotisch', 'UnifrakturMaguntia', Georgia, serif; font-weight:700; font-size:clamp(46px, 15vw, 68px); line-height:.9; text-align:center;
        color:#f2c862; letter-spacing:.01em; text-shadow:0 3px 0 #5a3410, 0 0 22px rgba(255,170,60,.45)}
      #boot .b-sub{font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:#d9b98a; opacity:.85}
      #boot .b-bar{width:100%; height:12px; margin-top:18vh; border-radius:7px; background:#0d0a08; box-shadow:inset 0 0 0 1px #4a3a2c, 0 0 0 3px rgba(0,0,0,.35); overflow:hidden}
      #boot .b-bar i{display:block; height:100%; width:6%; border-radius:7px; transition:width .5s ease;
        background:linear-gradient(90deg, #b8541a, #ff9a3c 60%, #ffd27a); box-shadow:0 0 12px rgba(255,150,60,.7); animation:b-start 4s ease-out forwards}
      #boot .b-txt{font-size:13px; color:#cdb79a; min-height:1.3em}
      @media (min-aspect-ratio: 1/1){#boot .b-scene{background-size:cover; background-position:center 60%; -webkit-mask-image:none; mask-image:none}}
      @keyframes b-zoom{from{transform:scale(1.08)} to{transform:scale(1)}}
      @keyframes b-start{to{width:38%}}
      @media (prefers-reduced-motion: reduce){#boot .b-scene, #boot .b-bar i{animation:none}}
